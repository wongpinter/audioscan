name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: uv sync --frozen --extra dev --extra gdrive --extra web
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run mypy src
