[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audioscan"
version = "0.1.0"
description = "Read audio/audiobook tags, chapters and covers without downloading whole files — local, HTTP, or Google Drive."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "sugeng" }]
keywords = ["audio", "metadata", "id3", "m4b", "audiobook", "mutagen", "range-request"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "mutagen>=1.47",
    "uvicorn>=0.30",
    "rich>=13.7",
]

[project.optional-dependencies]
gdrive = [
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
]
web = [
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "uvicorn>=0.30",
]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
audioscan = "audioscan.cli:main"
audiobook-web = "audioscan.web:main"

[project.urls]
Homepage = "https://github.com/sugeng/audioscan"

[tool.hatch.build.targets.wheel]
packages = ["src/audioscan"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# `artifacts/` holds the original Colab scripts this package replaces.
# They are kept verbatim for reference and must not be reformatted.
extend-exclude = ["artifacts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RET", "SIM", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
